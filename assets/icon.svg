<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <filter id="dropShadow" x="36" y="56" width="952" height="952" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="21" flood-color="#000000" flood-opacity="0.50" />
    </filter>
    <clipPath id="posterClip">
      <rect x="230" y="230" width="564" height="564" />
    </clipPath>
  </defs>

  <!-- Apple HIG macOS Squircle in Matte Industrial Carbon (#161514) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#161514" filter="url(#dropShadow)" />
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="3" />

  <!-- Centered 564×564 (3 × 188) Bauhaus Square-and-Circle Emblem matching WelcomePanel.tsx -->
  <g clip-path="url(#posterClip)">
    <!-- (2,0) Outer surface ground before modular grid & frame hairlines -->
    <rect x="606" y="230" width="188" height="188" fill="#1e1d1b" />

    <!-- 3×3 Modular Construction Grid + Outer Frame Hairlines -->
    <rect x="232" y="232" width="560" height="560" stroke="#2e2c29" stroke-width="4" />
    <path d="M 418 230 V 794 M 606 230 V 794 M 230 418 H 794 M 230 606 H 794" stroke="#2e2c29" stroke-width="4" />

    <!-- (0,0) Inscribed Cobalt Circle + Concentric Aperture Lens -->
    <circle cx="324" cy="324" r="94" fill="#3568a6" />
    <circle cx="324" cy="324" r="38" fill="#161514" />

    <!-- (1,0) + (1,1) Counter-Balanced Bauhaus Rotor (Tangent Quarter-Discs) -->
    <path d="M 606 418 L 418 418 A 188 188 0 0 1 606 230 Z" fill="#ede8de" />
    <path d="M 418 418 L 606 418 A 188 188 0 0 1 418 606 Z" fill="#2e2c29" />

    <!-- (2,0) Josef Albers Nested Vermilion Square -->
    <rect x="647" y="271" width="106" height="106" fill="#e0482d" />

    <!-- (0,1) Inscribed Hairline Circle + Centered Stone Square -->
    <circle cx="324" cy="512" r="92" stroke="#2e2c29" stroke-width="4" />
    <rect x="298" y="486" width="52" height="52" fill="#2e2c29" />

    <!-- (2,1) Tangent Ochre Gold Full Circle -->
    <circle cx="700" cy="512" r="94" fill="#dfa428" />

    <!-- (0,2) + (1,2) + (2,2) Vermilion Quarter-Disc, Ivory Square + Aperture, Cobalt Quarter-Disc Arch -->
    <path d="M 418 606 L 418 794 A 188 188 0 0 1 230 606 Z" fill="#e0482d" />
    <rect x="418" y="606" width="188" height="188" fill="#ede8de" />
    <circle cx="512" cy="700" r="53" fill="#161514" />
    <path d="M 606 606 L 794 606 A 188 188 0 0 1 606 794 Z" fill="#3568a6" />
  </g>
</svg>
